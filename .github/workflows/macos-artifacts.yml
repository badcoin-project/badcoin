name: CORE-L3.001L macOS 15 Boost.Build diagnostics

"on":
  push:
    branches:
      - diagnostic/core-l3-001l-macos15-lldb-20261118-01

permissions:
  contents: read

concurrency:
  group: core-l3-001l-${{ github.ref }}
  cancel-in-progress: false

jobs:
  boost-build-diagnostic:
    name: Boost 1.64 b2 crash diagnostics (macOS 15)
    if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/core-l3-001l-macos15-lldb-20261118-01'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MAKEJOBS: '-j2'
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2  # Include the exact parent for immutable baseline checks

      - name: Validate diagnostic identity and unchanged Boost recipe
        shell: bash
        run: |
          printf 'GITHUB_EVENT_NAME=%s\nGITHUB_REF=%s\nGITHUB_SHA=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/diagnostic/core-l3-001l-macos15-lldb-20261118-01
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show bd33b7546f38ec497d2b12bd4da35b188542ae59:depends/packages/boost.mk | shasum -a 256
          shasum -a 256 depends/packages/boost.mk
          test "$(git hash-object depends/packages/boost.mk)" = "$(git rev-parse bd33b7546f38ec497d2b12bd4da35b188542ae59:depends/packages/boost.mk)"
          test "$(git diff --name-only bd33b7546f38ec497d2b12bd4da35b188542ae59 HEAD)" = '.github/workflows/macos-artifacts.yml'

      - name: Set up Python 3.11 (same as failed workflow)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: arm64

      - name: Install original build prerequisites
        shell: bash
        run: |
          brew install automake libtool pkg-config cmake
          python -m pip install setuptools
          python --version
          python -c 'import setuptools; print(setuptools.__version__)'
          python3 -W ignore::DeprecationWarning -c 'import asyncore'

      - name: Capture host, compiler, linker, SDK and debugger
        shell: bash
        run: |
          printf '%s\n' '=== CORE-L3.001L HOST ==='
          sw_vers
          uname -a
          uname -m
          sysctl -n hw.optional.arm64 2>/dev/null || true
          xcode-select -p
          xcodebuild -version
          xcrun --find clang
          xcrun clang --version
          xcrun --find clang++
          xcrun clang++ --version
          xcrun --find ld
          xcrun ld -version_details
          xcrun --show-sdk-path
          xcrun --show-sdk-version
          xcrun --show-sdk-build-version
          lldb --version
          ./depends/config.guess
          test "$(uname -m)" = arm64
          printf '%s\n' '=== END HOST ==='

      - name: Run unchanged depends recipe and retain bounded diagnostic transcript
        shell: bash
        run: |
          printf '%s\n' '=== CORE-L3.001L ORIGINAL DEPENDS REPRODUCTION ==='
          echo 'COMMAND: make -C depends -j2 V=1'
          rc=0
          make -C depends -j2 V=1 > "$RUNNER_TEMP/core-l3-001l-make.log" 2>&1 || rc=$?
          printf 'DEPENDS_EXIT=%s\n' "$rc"
          printf 'DEPENDS_EXIT=%s\n' "$rc" >> "$GITHUB_ENV"
          printf '%s\n' '=== BOOST COMMANDS / FAILURE MARKERS ==='
          grep -En 'Building boost|Configuring boost|Staging boost|bootstrap\.sh|/b2 |Segmentation fault|SIGSEGV|Error 139|Error 11' "$RUNNER_TEMP/core-l3-001l-make.log" | tail -n 70 || true
          printf '%s\n' '=== BOOTSTRAP ENGINE COMPILE / LINK COMMANDS (LAST 100) ==='
          grep -En 'build\.sh|build\.jam|BOOST_JAM_CC|(^|[[:space:]])(clang|clang\+\+|gcc|g\+\+|cc|c\+\+|ld)([[:space:]]|$)|-o[[:space:]]+(b2|bjam)|bootstrap\.sh' "$RUNNER_TEMP/core-l3-001l-make.log" | tail -n 100 || true
          printf '%s\n' '=== LAST 140 DEPENDS LINES ==='
          tail -n 140 "$RUNNER_TEMP/core-l3-001l-make.log"
          printf '%s\n' '=== BOOTSTRAP LOGS ==='
          find depends/work -name bootstrap.log -type f -print -exec tail -n 90 {} \; 2>/dev/null || true
          printf '%s\n' '=== END ORIGINAL DEPENDS REPRODUCTION ==='

      - name: Inspect b2 Mach-O and replay failing command under LLDB
        shell: bash
        run: |
          printf '%s\n' '=== CORE-L3.001L LLDB DIAGNOSTICS ==='
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import shlex
          import subprocess

          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'core-l3-001l-make.log'
          lines = log.read_text(errors='replace').splitlines() if log.exists() else []
          candidates = [p for p in pathlib.Path('depends/work/build').rglob('b2') if p.is_file() and os.access(p, os.X_OK)]
          print('B2_CANDIDATES=', [str(p) for p in candidates])
          if not candidates:
              print('LLDB_RESULT=NO_B2_BINARY; cannot identify crash under debugger')
              raise SystemExit(0)

          b2 = next((p for p in candidates if '/boost/' in p.as_posix()), candidates[0]).resolve()
          print('B2_PATH=', b2)
          for command in (['file', str(b2)], ['otool', '-hv', str(b2)], ['otool', '-L', str(b2)]):
              result = subprocess.run(command, capture_output=True, text=True, errors='replace')
              print('COMMAND=', shlex.join(command), 'EXIT=', result.returncode)
              print((result.stdout + result.stderr)[-6000:])

          # The depends recipe prints its actual shell command when V=1.
          # Preserve its exact b2 arguments; never infer a different Boost version.
          invocations = []
          for line in lines:
              if './b2 ' not in line:
                  continue
              suffix = line.split('./b2 ', 1)[1]
              try:
                  words = shlex.split(suffix)
              except ValueError:
                  continue
              for terminator in ('stage', 'install'):
                  if terminator in words:
                      invocations.append((terminator, words[:words.index(terminator)+1], line))
                      break
          print('B2_INVOCATION_COUNT=', len(invocations))
          if not invocations:
              print('LLDB_RESULT=NO_EXACT_B2_INVOCATION_IN_LOG; refusing guessed reproduction')
              raise SystemExit(0)

          kind, args, source_line = invocations[-1]
          print('B2_PHASE=', kind)
          print('B2_RECIPE_LINE=', source_line[-4000:])
          print('LLDB_TARGET_ARGS=', shlex.join([str(b2)] + args))
          native = pathlib.Path('depends') / subprocess.run(['./depends/config.guess'], capture_output=True, text=True).stdout.strip() / 'native' / 'bin'
          env = os.environ.copy()
          env['PATH'] = str(native.resolve()) + os.pathsep + env['PATH']
          command = ['lldb', '--batch', '-o', 'run', '-k', 'process status', '-k', 'thread list', '-k', 'thread backtrace all -c 64', '-k', 'register read all', '-k', 'frame info', '-k', 'disassemble --frame', '-k', 'image list -b -o -f', '-k', 'image lookup --address $pc', '--', str(b2), *args]
          print('LLDB_COMMAND=', shlex.join(command))
          try:
              result = subprocess.run(command, cwd=str(b2.parent), env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors='replace', timeout=240)
              print('LLDB_EXIT=', result.returncode)
              print('=== LLDB CRASH-STOP OUTPUT ===')
              print(result.stdout)
              print('=== END LLDB OUTPUT ===')
          except subprocess.TimeoutExpired as exc:
              print('LLDB_RESULT=TIMEOUT_240_SECONDS')
              if exc.stdout:
                  print(exc.stdout[-16000:])
          PY
          printf '%s\n' '=== END CORE-L3.001L LLDB DIAGNOSTICS ==='

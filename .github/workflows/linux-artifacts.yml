name: Linux artifact build

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: linux-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux x64 core
    runs-on: ubuntu-22.04

    env:
      HOST: x86_64-pc-linux-gnu
      MAKEJOBS: "-j2"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libtool \
            autotools-dev \
            automake \
            pkg-config \
            bsdmainutils \
            curl \
            ca-certificates \
            git \
            python3 \
            cmake

      - name: Build depends
        run: |
          set -eux
          make -C depends HOST="${HOST}" ${MAKEJOBS} NO_QT=1

      - name: Configure
        run: |
          set -eux
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${HOST}/share/config.site" ./configure \
            --prefix=/ \
            --disable-ccache \
            --disable-maintainer-mode \
            --disable-dependency-tracking \
            --disable-bench \
            --without-gui || {
              status=$?
              echo "::group::config.log tail"
              if [ -f config.log ]; then
                tail -n 300 config.log
              else
                echo "config.log not found"
              fi
              echo "::endgroup::"
              exit "$status"
            }

      - name: Upload Linux configure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: badcoin-linux-config-logs
          path: |
            config.log
            config.status
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: |
          set -eux
          make ${MAKEJOBS}

      - name: Run unit tests
        run: |
          set -eux
          make check

      - name: Upload Linux unit-test failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-unit-test-failure-logs
          path: |
            src/test-suite.log
            src/test/test_badcoin.log
          if-no-files-found: warn

      - name: Run focused functional tests
        run: |
          set -eux
          test/functional/test_runner.py feature_datacarrier.py p2p_message_size.py

      - name: Stage Linux artifacts
        run: |
          set -eux
          mkdir -p artifacts/linux-x64-core

          cp -v src/badcoind artifacts/linux-x64-core/
          cp -v src/badcoin-cli artifacts/linux-x64-core/
          cp -v src/badcoin-tx artifacts/linux-x64-core/

          cd artifacts/linux-x64-core
          sha256sum badcoind badcoin-cli badcoin-tx > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: badcoin-linux-x64-core
          path: artifacts/linux-x64-core/
          if-no-files-found: error
          retention-days: 14

  linux-smoke:
    name: Linux x64 core smoke test
    needs: linux-build
    runs-on: ubuntu-22.04

    steps:
      - name: Download Linux core artifact
        uses: actions/download-artifact@v4
        with:
          name: badcoin-linux-x64-core
          path: artifact

      - name: Verify Linux core artifact
        working-directory: artifact
        run: |
          sha256sum -c SHA256SUMS.txt
          test -x badcoind
          test -x badcoin-cli
          test -x badcoin-tx

      - name: Smoke-test Linux core binaries
        working-directory: artifact
        run: |
          ./badcoind --version
          ./badcoin-cli --version
          ./badcoin-tx --help

      - name: Smoke-test Linux daemon and RPC
        working-directory: artifact
        run: |
          TESTDIR="$RUNNER_TEMP/badcoin-linux-core-smoke"
          mkdir -p "$TESTDIR"

          ./badcoind \
            -datadir="$TESTDIR" \
            -server=1 \
            -listen=0 \
            -dnsseed=0 \
            -connect=0 \
            -rpcuser=badcoin-ci \
            -rpcpassword=badcoin-ci-test \
            >"$TESTDIR/badcoind.log" 2>&1 &
          DAEMON_PID=$!

          sleep 5
          ./badcoin-cli -datadir="$TESTDIR" -rpcuser=badcoin-ci -rpcpassword=badcoin-ci-test getblockchaininfo
          ./badcoin-cli -datadir="$TESTDIR" -rpcuser=badcoin-ci -rpcpassword=badcoin-ci-test stop

          sleep 3
          if kill -0 "$DAEMON_PID" 2>/dev/null; then
            kill "$DAEMON_PID"
          fi

      - name: Upload Linux smoke logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: badcoin-linux-smoke-logs
          path: |
            \${{ runner.temp }}/badcoin-linux-core-smoke/badcoind.log
          if-no-files-found: warn
          retention-days: 14
